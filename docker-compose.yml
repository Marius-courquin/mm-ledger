services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - data:/app/data
    restart: unless-stopped

  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:latest
    network_mode: host
    environment:
      TWS_USERID: ${IBKR_USERNAME:-}
      TWS_PASSWORD: ${IBKR_PASSWORD:-}
      TRADING_MODE: live
      READ_ONLY_API: "yes"
      TWOFA_TIMEOUT_ACTION: restart
    volumes:
      - ib-gateway-data:/opt/ibc/config
    restart: unless-stopped

volumes:
  data:
  ib-gateway-data:
